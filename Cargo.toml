[workspace]
resolver = "2"
members = ["crates/nimitz-core", "crates/nimitz-mux", "crates/nimitz", "crates/admiralty"]

[workspace.package]
edition = "2021"
version = "0.3.1"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: f64 stamps (registry `updated_at`, event `ts`, notice `ts`)
# must read back bit for bit from disk
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.9"
libc = "0.2"
ratatui = "0.30"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
