[workspace]
resolver = "2"
members = ["crates/nimitz-core", "crates/nimitz-mux", "crates/nimitz", "crates/admiralty"]

[workspace.package]
edition = "2021"
version = "0.3.1"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
libc = "0.2"
ratatui = "0.30"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
