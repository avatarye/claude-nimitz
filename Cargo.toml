[workspace]
resolver = "2"
members = ["crates/nimitz-core", "crates/nimitz-mux", "crates/nimitz", "crates/admiralty"]

[workspace.package]
edition = "2021"
version = "0.7.11"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: f64 stamps (registry `updated_at`, event `ts`, notice `ts`)
# must read back bit for bit from disk
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
toml = "0.9"
libc = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_IO", "Win32_System_Console"] }
ratatui = "0.30"
unicode-width = "0.2"
nucleo-matcher = "0.3.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
