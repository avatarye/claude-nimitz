[package]
name = "nimitz-mux"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "claude-nimitz multiplexer adapters (Herdr first)"

[dependencies]
# the one shell list (`is_shell`) is core's (contracts.md section 9.1)
nimitz-core = { path = "../nimitz-core" }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true

# custom harness: the test binary doubles as the fake herdr (`__fake-herdr`)
[[test]]
name = "mux"
harness = false

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
