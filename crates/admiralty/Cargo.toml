[package]
name = "admiralty"
version = "0.3.0"
edition = "2021"
description = "The Admiralty TUI: watch and control every claude-nimitz fleet on this machine"
publish = false

[dependencies]
nimitz-core = { path = "../nimitz-core" }
nimitz-mux = { path = "../nimitz-mux" }
ratatui = { workspace = true }
libc.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
unicode-width = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile = "3"
