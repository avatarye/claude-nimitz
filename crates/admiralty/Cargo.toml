[package]
name = "admiralty"
version = "0.3.0"
edition = "2021"
description = "Live tree view of Claude Code fleets on this machine"
publish = false

[dependencies]
libc = "0.2"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
