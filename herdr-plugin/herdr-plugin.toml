id = "admiralty"
name = "Admiralty"
version = "0.6.0"
min_herdr_version = "0.9.0"
description = "Call up the admiralty fleet tree (claude-nimitz) over the current tab; the same key puts it away."
platforms = ["macos", "linux", "windows"]

# One action. Bind it to a key in config.toml (see README). `admiralty herdr toggle`
# closes the overlay when it is open in this tab and opens it otherwise. Both
# commands are the admiralty binary itself (on the Herdr server's PATH): Herdr runs
# an argv with no shell and takes one command per action id, so a shell script
# could not serve Windows. (Plugin id `admiralty`; before nimitz 0.3.1 it was
# `admiralty-watch`.)
[[actions]]
id = "toggle"
title = "Admiralty: toggle"
description = "Open the admiralty overlay in this tab, or close it if it is already open here."
contexts = ["global"]
command = ["admiralty", "herdr", "toggle"]

# The overlay itself. It closes when the admiralty TUI exits: q, or right after enter
# jumps to an agent's pane (`admiralty herdr watch` turns on --exit-after-jump).
# Overlay, not popup: a popup is session-modal, so Herdr's keys (this toggle
# included) never fire while it is up, and `plugin pane open` returns no pane id
# for it, so nothing can close it but its own process. An overlay is an ordinary
# plugin pane covering the tab: it has an id, Herdr keys still work, and it
# closes when its process exits. Overlay takes no width/height.
[[panes]]
id = "watch"
title = "Admiralty"
placement = "overlay"
command = ["admiralty", "herdr", "watch"]
